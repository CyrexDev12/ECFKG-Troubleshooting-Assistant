[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecfkg-pxi-prototype"
version = "0.1.0"
description = "Local generic/synthetic PXI diagnostic feasibility prototype"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "networkx>=3.4,<4", "pydantic>=2.9,<3", "httpx>=0.27,<1", "graphviz>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ecfkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=tmp/pytest"

